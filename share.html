<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FileVault - 文件下载</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 24px;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .filename {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            word-break: break-all;
            line-height: 1.4;
        }
        .filesize {
            font-size: 13px;
            color: #999;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transition: all 0.3s;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ef5350;
            margin-top: 16px;
            font-size: 13px;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }
        .progress-container {
            display: none;
            margin-top: 20px;
        }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }
        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 12px;
        }
        .type-badge.pdf { background: #ef5350; }
        .type-badge.word { background: #2196f3; }
        .type-badge.image { background: #4caf50; }
        .type-badge.other { background: #9e9e9e; }
        .preview-container {
            margin-bottom: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        @media (max-width: 400px) {
            .card { padding: 24px 16px; }
            .logo { font-size: 20px; margin-bottom: 20px; }
            .icon { font-size: 48px; }
            .filename { font-size: 15px; }
            .btn { padding: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">FileVault</div>
        <div class="preview-container" id="previewContainer" style="display: none;">
            <img id="previewImage" src="" alt="预览" />
        </div>
        <span class="type-badge" id="typeBadge">文件</span>
        <div class="icon" id="fileIcon">📁</div>
        <div class="filename" id="fileName">加载中...</div>
        <div class="filesize" id="fileSize"></div>
        <button class="btn" id="downloadBtn" disabled>正在加载文件...</button>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备下载...</div>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        <div class="error" id="error" style="display: none;"></div>
        <a href="/" class="back-link">← 返回主页</a>
    </div>

    <script>
        let fileData = null;

        function getFileIcon(category) {
            const icons = {
                pdf: '📄',
                word: '📝',
                image: '🖼️',
                other: '📁'
            };
            return icons[category] || icons.other;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function getFileCategory(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            if (ext === 'pdf') return 'pdf';
            if (['doc', 'docx'].includes(ext)) return 'word';
            if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext)) return 'image';
            return 'other';
        }

        function getTypeLabel(category) {
            const labels = {
                pdf: 'PDF',
                word: 'Word',
                image: '图片',
                other: '文件'
            };
            return labels[category] || labels.other;
        }

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const fileId = params.get('f');
            
            if (!fileId) {
                document.getElementById('fileName').textContent = '无效的分享链接';
                document.getElementById('error').textContent = '请检查链接是否正确';
                document.getElementById('error').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'none';
                return;
            }

            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch('/api/files/' + fileId);
                if (!response.ok) {
                    throw new Error('文件不存在');
                }

                fileData = await response.json();
                const category = fileData.category || getFileCategory(fileData.name);
                
                document.getElementById('fileIcon').textContent = getFileIcon(category);
                document.getElementById('typeBadge').textContent = getTypeLabel(category);
                document.getElementById('typeBadge').className = 'type-badge ' + category;
                document.getElementById('fileName').textContent = fileData.name;
                document.getElementById('fileSize').textContent = formatFileSize(fileData.size || 0);
                
                if (category === 'image') {
                    const previewContainer = document.getElementById('previewContainer');
                    const previewImage = document.getElementById('previewImage');
                    previewImage.src = '/api/download/' + fileId;
                    previewContainer.style.display = 'block';
                    document.getElementById('fileIcon').style.display = 'none';
                }
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.textContent = '下载文件';
                downloadBtn.disabled = false;
                
                downloadBtn.onclick = () => downloadFile(fileId, fileData.name);

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                document.getElementById('fileName').textContent = '加载失败';
                document.getElementById('error').textContent = error.message || '无法获取文件，请稍后重试';
                document.getElementById('error').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function downloadFile(fileId, fileName) {
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const downloadBtn = document.getElementById('downloadBtn');

            progressContainer.style.display = 'block';
            downloadBtn.disabled = true;
            downloadBtn.textContent = '下载中...';

            try {
                progressText.textContent = '正在连接服务器...';
                
                const response = await fetch('/api/download/' + fileId);
                
                if (!response.ok) {
                    throw new Error('下载失败');
                }

                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10) || 0;
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                progressText.textContent = '正在下载...';

                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    chunks.push(value);
                    loaded += value.length;
                    
                    if (total > 0) {
                        const percent = Math.round((loaded / total) * 100);
                        progressFill.style.width = percent + '%';
                        progressText.textContent = `下载中... ${formatFileSize(loaded)} / ${formatFileSize(total)} (${percent}%)`;
                    } else {
                        progressText.textContent = `已下载: ${formatFileSize(loaded)}`;
                    }
                }

                progressText.textContent = '正在处理文件...';
                
                const blob = new Blob(chunks);
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(url);

                progressFill.style.width = '100%';
                progressText.textContent = '下载完成！';
                
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = '重新下载';
                }, 2000);

            } catch (error) {
                progressText.textContent = '下载失败: ' + error.message;
                progressFill.style.width = '0%';
                downloadBtn.disabled = false;
                downloadBtn.textContent = '重试下载';
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
